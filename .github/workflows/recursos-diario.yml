# Todo dia consulta convênios, obras federais e o diário oficial de Edealina,
# grava em dados/recursos/edealina.json (seção "Recursos e repasses" do site)
# e avisa por Telegram/e-mail quando aparece algo novo.
name: Recursos e repasses diário

on:
  schedule:
    - cron: "17 10 * * *"   # todo dia às 7h17 de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recursos-diario
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Consultar as fontes
        env:
          CHAVE_PORTAL: ${{ secrets.CHAVE_PORTAL }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
        run: python ferramentas/monitor_recursos.py
      - name: Gravar no site
        run: |
          git config user.name "Recursos e repasses"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/recursos
          git diff --cached --quiet && exit 0
          git commit -m "Recursos e repasses de Edealina $(date -u +%F)"
          git pull --rebase
          git push
