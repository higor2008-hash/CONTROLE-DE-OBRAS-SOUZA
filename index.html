<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' blob: https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Controle de Obras Edealina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
<style>
  html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
  .conta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; font-size: 13px; color: var(--muted); padding-block: 0 24px !important; }
  .conta .quem { margin-right: auto; display: grid; line-height: 1.3; min-width: 0; }
  .conta .quem span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conta .quem b { color: var(--ink); font-weight: 600; }
  .login { max-width: 420px; margin: 6vh auto 0; }
  .login form { display: grid; gap: 12px; }
  .login form > .primary { width: 100%; padding-block: 12px; }
  .login-nota { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  .senha-campo { display: flex; gap: 6px; text-transform: none; letter-spacing: 0; }
  .senha-campo input { flex: 1; }
  dialog.painel { border: 0; padding: 0; background: transparent; width: min(640px, calc(100vw - 24px)); max-height: calc(100dvh - 24px); overflow: auto; }
  dialog.painel::backdrop { background: rgba(0, 0, 0, .45); }
  dialog.painel .blk { margin: 0; }
  dialog.painel form { display: grid; gap: 12px; }
  .equipe { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 10px; }
  .equipe li { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: end; }
  .equipe li.inativo { opacity: .65; }
  .eq-quem { display: grid; gap: 2px; font-size: 13px; color: var(--muted); min-width: 0; }
  .eq-quem b { color: var(--ink); font-size: 15px; }
  .eq-quem span { overflow-wrap: anywhere; }
  .eq-acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
  .eq-novo summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
  @media (max-width: 640px) {
    .conta { justify-content: stretch; }
    .conta .quem { flex: 1 1 100%; }
    .conta button { flex: 1 1 0; min-height: 44px; }
    .login { margin-top: 2vh; }
    .eq-acoes, .eq-acoes label.f { flex: 1 1 100%; }
    .eq-acoes button { flex: 1 1 0; min-height: 44px; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Carregando…</div></div>
<div class="wrap conta" id="conta" hidden>
  <div class="quem"><span>Conectado como <b id="conta-email"></b></span><span id="conta-papel"></span></div>
  <button class="sm" id="equipe-btn" hidden>Equipe</button>
  <button class="sm" id="trocar-senha">Trocar senha</button>
  <button class="sm" id="sair">Sair</button>
</div>
<dialog class="painel" id="painel" aria-label="Conta"><div id="painel-corpo"></div></dialog>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="backend.js"></script>
</body>
</html>
